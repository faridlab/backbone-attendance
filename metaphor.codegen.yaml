# Codegen policy for attendance.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Own the hand-written Attendance SQL (the present-days read-port) that the query service
  # delegates to. Declared here — not renamed with a `_custom` suffix — so the generator skips it
  # wholesale; this declaration is what makes editing it legitimate (mirrors backbone-hr's repo
  # ownership).
  - "src/infrastructure/persistence/attendance_repository.rs"
  # The public query-service trait gains a hand-written port method (`present_days`); owning the
  # file keeps that method across regen instead of living behind a CUSTOM marker outside the trait.
  - "src/exports/services.rs"
  # Hand-written `AttendanceQueryService` impl (delegates standard lookups to GenericCrudService +
  # `present_days` to the repo). User-owned so the impl survives regen.
  - "src/application/service/attendance_query_service.rs"
  # The validated write path (H-3): punch in/out with auto-direction, kiosk Tier B PIN policy
  # (argon2id + escalating lockout, ADR-0018), session corrections with mandatory reason,
  # EXCLUDE-overlap 23P01 → 409 mapping, daily rollup upsert.
  - "src/application/service/attendance_write_service.rs"
  # All hand-written write SQL for that service (sessions, immutable clock events, kiosk PINs,
  # rollup upsert) — transaction-scoped `&mut PgConnection` methods, company bound by the service.
  - "src/infrastructure/persistence/attendance_write_repository.rs"
  # Guarded composition: validated writes + entity reads (attendance/clock/session only —
  # kiosk_pin reads are deliberately NOT mounted; hashes never leave via a generic GET).
  - "src/presentation/http/guarded_routes.rs"
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # - "tests/*_golden_cases.rs"
  # Route-level integrity probes (W1 P2): real company_auth + HS256 token, oneshot router,
  # RLS-fenced assertion reads via with_company_scope. Covers kiosk PIN policy end-to-end,
  # EXCLUDE overlap → 409, rollup/clock-event writes, cross-company fence, unauthenticated 401.
  - "tests/integrity_probes.rs"

  # Hand-authored module documentation.
  - "docs/**"
