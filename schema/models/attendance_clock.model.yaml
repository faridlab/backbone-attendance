# =============================================================================
# Domain: attendance
# Entity: AttendanceClock
# Description: Raw punch events — immutable-append (pillar-people H-3). Each
#              event carries its instant (punched_at timestamptz) and direction;
#              the write path links it to the AttendanceSession it opened or
#              closed. Nothing here is ever updated or deleted — corrections
#              edit sessions (with reason + audit), never the punch log.
# =============================================================================

models:
  # Tenancy: none, by design (ADR-0029). Tenant-agnostic and reusable; a composing
  # service's tenancy decorator owns org scoping for this table.
  - name: AttendanceClock
    collection: attendance_clocks
    description: "Raw punch events (in/out) — immutable-append, linked to a session."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique record id"

      session_id:
        type: uuid
        attributes: ["@required", "@foreign_key(AttendanceSession.id)"]
        description: "The session this punch opened/closed # FK attendance_sessions.id (in-module)"

      employee_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The employee # logical FK employee.Employee.id"

      date:
        type: date
        attributes: ["@required"]
        description: "Business date of the punch (local), denormalized for day-grain queries"

      punched_at:
        type: datetime
        attributes: ["@required"]
        description: "Punch instant (timestamptz)"

      direction:
        type: PunchDirection
        attributes: ["@required", "@default(in)"]
        description: "Punch direction"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [session_id]
      - type: index
        fields: [employee_id, date]

enums:
  - name: PunchDirection
    description: "Punch direction"
    variants:
      - name: in
        default: true
        description: "Clock in"
      - name: out
        description: "Clock out"
